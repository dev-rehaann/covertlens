repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: forbid-sensitive-network-data
        name: prevent sensitive network data commits
        entry: Packet captures and generated data must not be committed
        language: fail
        files: '(?i)(^data/(raw|processed)/|\.pcap(?:ng)?$)'
        exclude: '^data/(raw|processed)/\.gitkeep$'
